[package]
name = "fmd"
version = "1.1.5"
edition = "2021"
authors = ["Brian Kellogg"]
description = "Parse file meta data for forensics purposes."
repository = "https://github.com/theflakes/fmd"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
infer = "*"
fuzzyhash = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
md5 = "*"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
dunce = "*"
path_abs = "*"
chrono = "*"
lazy_static = "*"
whoami = "*"
goblin = "*"
entropy = "*"
ntfs = "*"
anyhow = "*"
rayon = "*"
epochs = "*"
is_elevated = "*"
exe = "*"
frnsc-prefetch = "0.13"
forensic-rs = "0.13"
lnk = "*"
memmap2 = "0.9"

[profile.release]
lto = "fat"
panic = 'abort'
opt-level = "s"
debug = false
rpath = false
debug-assertions = false
codegen-units = 1
strip = "symbols"
